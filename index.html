<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather app</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="/logo/clouds-and-sun.png" />

</head>

<body>
  <div class="container">
    <header>
      <p class="title">The.Weather</p>
    </header>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Search city...">

      <button id="searchBtn">Search</button>
    </div>

    <main class="card">
      <div class="location">
        <span id="cityName"></span>
        <span>.</span>
        <span id="country"></span>
      </div>
      <div class="time">
        <span id="day"></span>
        <span id="month"></span>
        <span id="month-day"></span>
        <span>.</span>
        <span id="hour"></span>:<span id="min"></span>
        <span></span>
      </div>

      <div class="weatherIcon" id="weatherIcon"></div>

      <div class="temp"><span>24</span>°C</div>
      <div class="condition">Clear sky</div>

      <div class="stats">
        <div class="humidity">
          <img src="logo/humidity.png" alt="humidity" width="20%">
          <span>75%</span>
          <span>Humudity</span>
        </div>
        <div class="wind">
          <img src="logo/wind.png" alt="wind" width="20%">
          <span><span>3</span>Km/h</span>
          <span>Wind</span>
        </div>
        <div class="visibility">
          <img src="logo/visibility.png" alt="visibility" width="20%">
          <span><span>10</span>km</span>
          <span>Visibility</span>
        </div>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
  <script src="config.js"></script>
</body>

</html>
