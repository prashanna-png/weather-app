<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>

<body>
  <div class="container">
    <div class="header">
      <img src="logo/clouds-and-sun.png" alt="logo" width="15%">
      <h1>Weather App</h1>
    </div>
    <p class="quote">real-time weather, anywhere</p>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Search City.....">
      <button id="searchBtn">Search</button>
    </div>

    <div class="weather-card" id="weatherCard">
      <h2 id="cityName"></h2>
      <p id="temperature"></p>
      <p id="condition"></p>
      <p id="country"></p>
      <div class="stats">
        <div class="stat">
          <p id="humidity"></p>
          <span></span>
        </div>
        <div class="stat">
          <p id="wind"></p>
          <span></span>
        </div>
        <div class="stat">
          <p id="visibility"></p>
          <span></span>
        </div>
      </div>
    </div>

  </div>
  <script src="config.js"></script>
  <script src=" script.js"></script>
</body>

</html>
